<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Frontverlauf - Vorschlag B: Gezeichnet / proposal B: inked</title>
  <link rel="stylesheet" href="/src/design/tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--s-surface); color: var(--s-text); font-family: var(--p-font-body); font-size: var(--p-font-size-sm); }
    body { display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--p-space-2); padding: var(--p-space-2); background: var(--s-surface-sunken); border-bottom: var(--p-space-half) solid var(--s-outline); }
    header h1 { margin: 0 var(--p-space-2) 0 0; font-family: var(--p-font-comic); font-size: var(--p-font-size-lg); font-weight: var(--p-font-weight-regular); letter-spacing: 0.03em; }
    .group { display: flex; flex-wrap: wrap; gap: var(--p-space-1); align-items: center; }
    button, select { font: inherit; color: var(--s-text); background: var(--s-surface-raised); border: var(--p-space-half) solid var(--s-outline); border-radius: var(--p-radius-sm); padding: var(--p-space-1) var(--p-space-2); cursor: pointer; }
    button[aria-pressed="true"] { background: var(--s-accent); font-weight: var(--p-font-weight-bold); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: var(--p-space-half) solid var(--s-focus); outline-offset: var(--p-space-half); }
    label.check { display: inline-flex; align-items: center; gap: var(--p-space-1); background: var(--s-surface-raised); border: var(--p-space-half) solid var(--s-outline); border-radius: var(--p-radius-sm); padding: var(--p-space-half) var(--p-space-2); }
    #stage { position: relative; flex: 1 1 auto; min-height: 0; touch-action: none; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .tag { position: absolute; left: var(--p-space-2); top: var(--p-space-2); background: var(--s-surface-raised); border: var(--p-space-half) solid var(--s-outline); border-radius: var(--p-radius-sm); padding: var(--p-space-half) var(--p-space-2); font-family: var(--p-font-comic); font-size: var(--p-font-size-md); letter-spacing: 0.03em; pointer-events: none; }
    #tagB { left: calc(50% + var(--p-space-2)); background: var(--s-accent); }
    .divider { position: absolute; left: 50%; top: 0; bottom: 0; border-left: var(--p-space-half) solid var(--s-outline); pointer-events: none; }
    #readout { position: absolute; right: var(--p-space-2); bottom: var(--p-space-2); max-width: calc(100% - 2 * var(--p-space-2)); box-sizing: border-box; background: var(--s-surface-raised); border: var(--p-space-half) solid var(--s-outline); border-radius: var(--p-radius-sm); padding: var(--p-space-1) var(--p-space-2); font-size: var(--p-font-size-xs); line-height: 1.35; }
    summary { cursor: pointer; font-weight: var(--p-font-weight-bold); }
    #opts { background: var(--s-surface-raised); border: var(--p-space-half) solid var(--s-outline); border-radius: var(--p-radius-sm); padding: var(--p-space-1) var(--p-space-2); }
    #opts[open] { flex-basis: 100%; }
    #opts[open] summary { margin-bottom: var(--p-space-1); }
    #opts label.check { border-width: 1px; }
    #readout table { border-collapse: collapse; }
    #readout th, #readout td { text-align: right; padding: 0 var(--p-space-1); font-weight: var(--p-font-weight-regular); }
    #readout th:first-child, #readout td:first-child { text-align: left; }
    #readout thead th { font-weight: var(--p-font-weight-bold); border-bottom: 1px solid var(--s-outline); }
    body.stacked #tagB { left: var(--p-space-2); top: calc(50% + var(--p-space-2)); }
    body.stacked .divider { left: 0; right: 0; top: 50%; bottom: auto; border-left: 0; border-top: var(--p-space-half) solid var(--s-outline); }
    body.bare header, body.bare #readout { display: none; }
    @media (max-width: 640px) {
      header { gap: var(--p-space-1); padding: var(--p-space-1); }
      header h1 { font-size: var(--p-font-size-md); width: 100%; }
      button, select { padding: var(--p-space-half) var(--p-space-1); }
      #readout { font-size: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vorschlag B: Gezeichnet / Proposal B: Inked</h1>
    <div class="group" role="group" aria-label="Einheit / unit">
      <button id="uSoldier" type="button">Schuetze / Rifleman</button>
      <button id="uTank" type="button">Panzer / Tank</button>
    </div>
    <div class="group" role="group" aria-label="Ansicht / view">
      <button id="vClose" type="button">Nah / Close</button>
      <button id="vFace" type="button">Detail / Detail</button>
      <button id="vBoard" type="button">Brett / Board</button>
    </div>
    <details id="opts">
      <summary>Ebenen / Layers</summary>
      <div class="group">
      <label class="check"><input type="checkbox" id="lTex" checked />Zeichnung / Drawing</label>
      <label class="check"><input type="checkbox" id="lInk" checked />Tusche / Ink</label>
      <label class="check"><input type="checkbox" id="lHatch" checked />Schraffur / Hatching</label>
      <label class="check"><input type="checkbox" id="lAo" checked />Verdeckung / Occlusion</label>
      <label class="check"><input type="checkbox" id="lGloss" checked />Glanz + Kantenlicht / Glint + rim</label>
      <label for="tex">Textur / Texture</label>
      <select id="tex"><option value="512">512</option><option value="1024" selected>1024</option><option value="2048">2048</option></select>
      <label class="check" id="turretBox"><span>Turm / Turret</span><input type="range" id="turret" min="-180" max="180" value="0" /></label>
      </div>
    </details>
  </header>
  <div id="stage">
    <canvas id="view"></canvas>
    <div class="divider"></div>
    <div class="tag" id="tagA">Bisher / Current</div>
    <div class="tag" id="tagB">Vorschlag B / Proposal B</div>
    <details id="readout"><summary>Kosten / Cost</summary><div id="readoutBody"></div></details>
  </div>
  <script type="module" src="/src/render/models/proto/b/page.ts"></script>
</body>
</html>
